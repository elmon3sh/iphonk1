<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squad Assistant | iPHONK</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-page: #f2f4f8;
            --bg-card: rgba(255, 255, 255, 0.92);
            --bg-subtle: #f7f9fc;
            --border-subtle: rgba(15, 23, 42, 0.08);
            --border-highlight: rgba(0, 113, 227, 0.28);
            --accent: #0071e3;
            --accent-deep: #0055b3;
            --accent-soft: rgba(0, 113, 227, 0.1);
            --accent-gradient: linear-gradient(135deg, #0a84ff 0%, #0060df 100%);
            --text-primary: #14171f;
            --text-secondary: #5a6270;
            --text-muted: #8892a4;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-text: #047857;
            --warn-bg: rgba(245, 158, 11, 0.14);
            --warn-text: #b45309;
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --shadow-sm: 0 4px 14px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 14px 36px rgba(15, 23, 42, 0.06);
            --shadow-glow: 0 10px 26px rgba(0, 113, 227, 0.25);
            --font-ar: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-en: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-ar);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background:
                radial-gradient(900px 420px at 50% -60px, rgba(0, 113, 227, 0.13), transparent 70%),
                radial-gradient(700px 380px at 85% 10%, rgba(99, 102, 241, 0.08), transparent 65%),
                var(--bg-page);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 72px;
        }

        .num-en {
            font-family: var(--font-en);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* البانر العلوي */
        .brand-banner {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(26px) saturate(180%);
            -webkit-backdrop-filter: blur(26px) saturate(180%);
            border-bottom: 1px solid var(--border-subtle);
            padding: 20px 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .header-logo {
            max-height: 56px;
            width: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.06));
            transition: transform 0.25s ease;
        }

        .header-logo:hover {
            transform: scale(1.03);
        }

        .squad-badge {
            margin-top: 9px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 15px;
            border-radius: 999px;
            background: linear-gradient(180deg, #ffffff 0%, #f3f6fb 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            font-family: var(--font-en);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.7px;
            color: var(--text-primary);
        }

        .squad-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1080px;
            margin: 26px auto 0;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* صف شريط البحث + زر الأدمن الصغير */
        .search-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .global-search-wrapper {
            flex: 1;
            position: relative;
        }

        .global-search-input {
            width: 100%;
            padding: 14px 48px 14px 115px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: var(--shadow-md);
            outline: none;
            transition: all 0.22s ease;
        }

        .global-search-input::placeholder {
            color: var(--text-muted);
            font-weight: 500;
        }

        .global-search-input:focus {
            border-color: var(--border-highlight);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.14), var(--shadow-md);
        }

        .global-search-icon {
            position: absolute;
            right: 19px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.02rem;
            pointer-events: none;
        }

        .search-controls-left {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-scope-badge {
            font-size: 0.72rem;
            background: var(--accent-soft);
            color: var(--accent);
            padding: 3px 11px;
            border-radius: 999px;
            font-weight: 800;
            display: none;
        }

        .btn-clear-search {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(15, 23, 42, 0.08);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .btn-clear-search:hover {
            background: rgba(15, 23, 42, 0.16);
            color: var(--text-primary);
        }

        /* زر الدخول الصغير للأدمن بجانب البحث */
        .btn-admin-shortcut {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            backdrop-filter: blur(14px);
            box-shadow: var(--shadow-md);
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .btn-admin-shortcut:hover {
            border-color: var(--border-highlight);
            color: var(--accent);
            background: #ffffff;
            transform: translateY(-1px) scale(1.04);
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.16);
        }

        .btn-admin-shortcut:active {
            transform: scale(0.96);
        }

        /* التبويبات الثلاثة */
        .category-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            padding: 7px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 700px) {
            .category-tabs {
                grid-template-columns: 1fr;
            }
        }

        .tab-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 0.94rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: all 0.22s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.8);
        }

        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: var(--shadow-glow);
        }

        .tab-label-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-count {
            background: rgba(15, 23, 42, 0.06);
            color: var(--text-primary);
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-family: var(--font-en);
            font-weight: 800;
        }

        .tab-btn.active .tab-count {
            background: rgba(255, 255, 255, 0.24);
            color: #ffffff;
        }

        /* بطاقة الكتالوج */
        .catalog-card {
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: var(--shadow-md);
        }

        .catalog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .catalog-title {
            font-size: 1.18rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .catalog-subtitle {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--success-bg);
            color: var(--success-text);
            font-size: 0.76rem;
            font-weight: 800;
        }

        /* الجدول */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            background: #ffffff;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        .products-table th {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .products-table td {
            padding: 14px 16px;
            font-size: 0.92rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(15, 23, 42, 0.045);
            vertical-align: middle;
        }

        .products-table tbody tr:last-child td {
            border-bottom: none;
        }

        .products-table tbody tr {
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .products-table tbody tr:hover {
            background: rgba(0, 113, 227, 0.035);
        }

        .product-name-cell {
            font-weight: 800;
            color: var(--text-primary);
        }

        .spec-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 8px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .battery-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .battery-good {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .battery-mid {
            background: var(--warn-bg);
            color: var(--warn-text);
        }

        .price-pill {
            display: inline-block;
            background: linear-gradient(180deg, #f3f8ff 0%, #e7f1ff 100%);
            border: 1px solid #c6defe;
            color: var(--accent-deep);
            padding: 5px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 800;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-subtle);
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
        }

        .cat-pill {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 0.72rem;
            background: var(--accent-soft);
            color: var(--accent);
            margin-right: 6px;
            font-weight: 800;
        }

        .empty-state {
            text-align: center;
            padding: 42px 16px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header class="brand-banner">
        <img src="logo.png" alt="iPHONK Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="squad-badge">
            <span class="squad-dot"></span>
            <span>Squad Assistant</span>
        </div>
    </header>

    <main class="container">
        <!-- صف شريط البحث + زر الأدمن الصغير -->
        <div class="search-bar-row">
            <div class="global-search-wrapper">
                <span class="global-search-icon">🔍</span>
                <input type="text" id="globalSearchInput" class="global-search-input" placeholder="ابحث في كل الأقسام (أجهزة جديدة، مستعملة، اكسسوارات)..." oninput="handleSearchInput()">
                <div class="search-controls-left">
                    <span id="searchScopeBadge" class="search-scope-badge">بحث شامل</span>
                    <button type="button" id="clearSearchBtn" class="btn-clear-search" onclick="clearSearch()" title="مسح البحث">✕</button>
                </div>
            </div>
            <a href="admin.html" class="btn-admin-shortcut" title="لوحة الإدارة">🔒</a>
        </div>

        <div class="category-tabs">
            <button type="button" class="tab-btn active" data-cat="new" onclick="switchCategory('new', this)">
                <span class="tab-label-group"><span>📱</span><span>الأجهزة الجديدة</span></span>
                <span class="tab-count" id="count-new">0</span>
            </button>
            <button type="button" class="tab-btn" data-cat="used" onclick="switchCategory('used', this)">
                <span class="tab-label-group"><span>🔄</span><span>الأجهزة المستعملة</span></span>
                <span class="tab-count" id="count-used">0</span>
            </button>
            <button type="button" class="tab-btn" data-cat="accessories" onclick="switchCategory('accessories', this)">
                <span class="tab-label-group"><span>🎧</span><span>الاكسسوارات</span></span>
                <span class="tab-count" id="count-accessories">0</span>
            </button>
        </div>

        <section class="catalog-card">
            <div class="catalog-header">
                <div>
                    <h1 class="catalog-title" id="currentCategoryTitle">الأجهزة الجديدة</h1>
                    <p class="catalog-subtitle" id="currentCategorySubtitle">قائمة الأسعار والتفاصيل المحدّثة لحظياً</p>
                </div>
                <span class="live-pill">● مزامنة مباشرة</span>
            </div>

            <div class="table-wrapper">
                <table class="products-table">
                    <thead>
                        <tr id="productsTableHead">
                            <th>اسم المنتج</th>
                            <th>المساحة</th>
                            <th>اللون</th>
                            <th>السعر</th>
                            <th>المدخل</th>
                            <th>تاريخ آخر تحديث</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr>
                            <td colspan="6" class="empty-state">
                                <div class="empty-state-icon">⏳</div>
                                <div>جاري تحميل المنتجات...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD3a3CPO8pOzfbzAnxDoZcLt_jhVwMdxuI",
            authDomain: "iphonk-df6b0.firebaseapp.com",
            databaseURL: "https://iphonk-df6b0-default-rtdb.firebaseio.com",
            projectId: "iphonk-df6b0",
            storageBucket: "iphonk-df6b0.firebasestorage.app",
            messagingSenderId: "878080840386",
            appId: "1:878080840386:web:937f098bff921eb2a6a15b",
            measurementId: "G-RDGY7ZVJMW"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        let allProducts = {};
        let currentCategory = 'new';

        const categoryLabels = {
            new: 'الأجهزة الجديدة',
            used: 'الأجهزة المستعملة',
            accessories: 'الاكسسوارات'
        };

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatLastUpdated(timestamp) {
            if (!timestamp) return '---';
            const date = new Date(Number(timestamp));
            if (isNaN(date.getTime())) return '---';
            const datePart = date.toLocaleDateString('en-GB', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
            const timePart = date.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
            return `${datePart} - ${timePart}`;
        }

        function listenToProducts() {
            database.ref('products').on('value', (snapshot) => {
                allProducts = snapshot.val() || {};
                updateCategoryCounts();
                renderProductsTable();
            });
        }

        function updateCategoryCounts() {
            const counts = { new: 0, used: 0, accessories: 0 };
            Object.values(allProducts).forEach(item => {
                if (item && counts[item.category] !== undefined) {
                    counts[item.category]++;
                }
            });
            document.getElementById('count-new').textContent = counts.new;
            document.getElementById('count-used').textContent = counts.used;
            document.getElementById('count-accessories').textContent = counts.accessories;
        }

        function switchCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            clearSearch();
        }

        function handleSearchInput() {
            const val = document.getElementById('globalSearchInput').value;
            document.getElementById('clearSearchBtn').style.display = val.length > 0 ? 'flex' : 'none';
            renderProductsTable();
        }

        function clearSearch() {
            document.getElementById('globalSearchInput').value = '';
            document.getElementById('clearSearchBtn').style.display = 'none';
            renderProductsTable();
        }

        function renderBatteryBadge(batteryVal) {
            if (batteryVal === '' || batteryVal === undefined || batteryVal === null) {
                return '<span class="spec-tag">—</span>';
            }
            const num = Number(batteryVal);
            const cls = num >= 85 ? 'battery-good' : 'battery-mid';
            return `<span class="battery-pill num-en ${cls}">🔋 ${escapeHTML(String(batteryVal))}%</span>`;
        }

        function renderProductsTable() {
            const tbody = document.getElementById('productsTableBody');
            const thead = document.getElementById('productsTableHead');
            const rawQuery = document.getElementById('globalSearchInput').value;
            const searchQuery = rawQuery.toLowerCase().trim();
            const searchBadge = document.getElementById('searchScopeBadge');
            const titleEl = document.getElementById('currentCategoryTitle');
            const subtitleEl = document.getElementById('currentCategorySubtitle');

            tbody.innerHTML = '';

            const isSearching = searchQuery.length > 0;
            searchBadge.style.display = isSearching ? 'inline-block' : 'none';

            if (isSearching) {
                titleEl.textContent = `نتائج البحث: "${rawQuery.trim()}"`;
                subtitleEl.textContent = 'بحث شامل في جميع الأقسام (الجديدة، المستعملة، والاكسسوارات)';
            } else {
                titleEl.textContent = categoryLabels[currentCategory];
                subtitleEl.textContent = 'قائمة الأسعار والتفاصيل المحدّثة لحظياً';
            }

            const columns = [
                { key: 'name', label: 'اسم المنتج' },
                ...(isSearching || currentCategory === 'used' ? [{ key: 'battery', label: 'نسبة البطارية' }] : []),
                ...(isSearching || currentCategory === 'new' || currentCategory === 'used' ? [{ key: 'storage', label: 'المساحة' }] : []),
                ...(isSearching || currentCategory === 'new' || currentCategory === 'used' ? [{ key: 'color', label: 'اللون' }] : []),
                { key: 'price', label: 'السعر' },
                { key: 'enteredBy', label: 'المدخل' },
                { key: 'updatedAt', label: 'تاريخ آخر تحديث' }
            ];

            thead.innerHTML = columns.map(col => `<th>${col.label}</th>`).join('');

            const entries = Object.entries(allProducts).sort((a, b) => (b[1]?.updatedAt || 0) - (a[1]?.updatedAt || 0));
            let matchedCount = 0;

            entries.forEach(([, item]) => {
                if (!item) return;
                const haystack = `${item.name || ''} ${item.color || ''} ${item.storage || ''}`.toLowerCase();
                const nameMatch = haystack.includes(searchQuery);
                const shouldShow = isSearching ? nameMatch : (item.category === currentCategory);

                if (shouldShow) {
                    matchedCount++;
                    const priceFormatted = Number(item.price || 0).toLocaleString('en-US') + ' EGP';
                    const updatedFormatted = formatLastUpdated(item.updatedAt);
                    const enteredBy = item.enteredBy || item.addedBy || item.createdBy || item.inputBy || '—';
                    const isDevice = item.category === 'new' || item.category === 'used';

                    const catTag = isSearching
                        ? `<span class="cat-pill">${escapeHTML(categoryLabels[item.category] || '')}</span>`
                        : '';

                    const cells = columns.map(col => {
                        switch (col.key) {
                            case 'name':
                                return `<td class="product-name-cell">${escapeHTML(item.name || '---')} ${catTag}</td>`;
                            case 'battery':
                                return `<td>${item.category === 'used' ? renderBatteryBadge(item.battery) : '<span class="spec-tag">—</span>'}</td>`;
                            case 'storage':
                                return `<td>${isDevice && item.storage ? `<span class="spec-tag num-en">${escapeHTML(item.storage)}</span>` : '<span class="spec-tag">—</span>'}</td>`;
                            case 'color':
                                return `<td>${isDevice && item.color ? `<span class="spec-tag">${escapeHTML(item.color)}</span>` : '<span class="spec-tag">—</span>'}</td>`;
                            case 'price':
                                return `<td><span class="price-pill num-en">${priceFormatted}</span></td>`;
                            case 'enteredBy':
                                return `<td>${escapeHTML(enteredBy)}</td>`;
                            case 'updatedAt':
                                return `<td><span class="date-badge num-en">🕒 ${updatedFormatted}</span></td>`;
                            default:
                                return '<td>—</td>';
                        }
                    }).join('');

                    const tr = document.createElement('tr');
                    tr.innerHTML = cells;
                    tbody.appendChild(tr);
                }
            });

            if (matchedCount === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${columns.length}" class="empty-state">
                            <div class="empty-state-icon">${isSearching ? '🔎' : '📦'}</div>
                            <div>${isSearching ? 'لا توجد نتائج مطابقة لبحثك في أي قسم.' : 'لا توجد منتجات مدرجة في هذا القسم حالياً.'}</div>
                        </td>
                    </tr>
                `;
            }
        }

        listenToProducts();
    </script>
</body>
</html>
